name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Swift 6.4 / macOS 12
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SWIFTERKIT_REQUIRE_DRIVERKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify compatibility toolchain
        run: |
          test "$(head -n 1 Package.swift)" = "// swift-tools-version:6.4.0"
          swift --version | grep -E "Swift version 6\.4([ .(]|$)"
          xcodebuild -version

      - name: Verify deployment floor
        run: |
          swift package dump-package | jq -e 'any(.platforms[]; .platformName == "macos" and .version == "12.0")'

      - name: Test package
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build release package
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Check DriverKit coverage claims
        run: |
          swift run SwifterKitCoverage check \
            --sdk "$(xcrun --sdk driverkit --show-sdk-path)" \
            --article Sources/SwifterKit/SwifterKit.docc/DriverKitCoverage.md

  linux:
    name: Swift 6.4 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Test package
        run: swift test -Xswiftc -warnings-as-errors

  validate:
    name: Swift 6 and DriverKit
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SWIFTERKIT_REQUIRE_DRIVERKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Toolchain
        run: |
          grep -E "^6\.4([.]|$)" .swift-version
          sw_vers
          swift --version | grep -E "Swift version 6\.4([ .(]|$)"
          xcodebuild -version

      - name: Install validation tools
        run: brew install swiftlint llvm

      - name: Validate
        run: ./scripts/ci/validate.sh
